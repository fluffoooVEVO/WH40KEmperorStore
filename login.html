<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Emperor Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="estilos/styles.css">
</head>
<body>
    <header>
        <nav>
        <div class="nav-wrapper">
            <a href="index.html" class="brand-logo">
                <img src="img/Logo.jpg" alt="Logo de Emperor Store" class="logo-navbar">
            </a>
            <ul id="nav-mobile" class="right hide-on-med-and-down">
                <li><a href="index.html">Home</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="carrito.html"><i class="material-icons">shopping_cart</i></a></li>
                <li id="zona-sesion"><a href="login.html"><i class="material-icons">account_circle</i></a></li>
            </ul>
        </div>
        </nav>
    </header>

    <main>
        <section class="auth-section">
            <div class="container">
                <div class="row">
                    <div class="col s12 m8 offset-m2 l6 offset-l3">
                        <div class="card auth-card">
                            <div class="card-content">
                                <span class="card-title">Iniciar sesión</span>
                                <p id="mensaje-login" class="mensaje-error"></p>

                                <form id="form-login">
                                    <div class="input-field">
                                        <input id="login-email" type="email" required>
                                        <label for="login-email">Correo electrónico</label>
                                    </div>

                                    <div class="input-field">
                                        <input id="login-password" type="password" required>
                                        <label for="login-password">Contraseña</label>
                                    </div>

                                    <button type="submit" class="btn waves-effect waves-light auth-btn">
                                        Ingresar
                                        <i class="material-icons right">login</i>
                                    </button>
                                </form>

                                <p class="auth-link">
                                    ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script src="js/validaciones.js"></script>
</body>
</html>
