    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Oswald:wght@400;600&display=swap" rel="stylesheet">

<body>
    <header>
        <nav>
        <div class="nav-wrapper">

                        <p id="detalle-descripcion"></p>
                        <p id="detalle-stock"></p>
                        <label for="cantidad">Cantidad:</label>
                        <input type="number" id="cantidad" min="1" value="1">
                        <button id="btn-agregar-carrito" class="btn waves-effect waves-light">
                            Agregar al Carrito
                        </button>
                    </div>
                </div>
            </div>
