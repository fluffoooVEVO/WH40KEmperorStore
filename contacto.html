    <main class="container contacto-section">
        <h1>Contacto</h1>
        <p>
            ¿Tienes alguna consulta? Envíanos un mensaje y nos pondremos
            en contacto contigo.
        </p>
        <form id="form-contacto" class="contacto-card">
            <div class="input-field">
                <input id="nombre" type="text" required>
                <label for="nombre">Nombre</label>
            </div>
            <div class="input-field">
                <input id="correo" type="email" required>
                <label for="correo">Correo electrónico</label>
            </div>
            <div class="input-field">
                <input id="asunto" type="text" required>
                <label for="asunto">Asunto</label>
            </div>
            <div class="input-field">
                <textarea id="mensaje" class="materialize-textarea" required></textarea>
                <label for="mensaje">Mensaje</label>
            </div>
            <button
                class="btn waves-effect waves-light"
                type="submit">
                Enviar
                <i class="material-icons right">send</i>
            </button>
        </form>
    </main>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js">
    </script>
    <script src="js/main.js"></script>
