<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - Emperor Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="estilos/styles.css">
</head>
<body>
    <header>
        <nav>
        <div class="nav-wrapper">
            <a href="index.html" class="brand-logo">
                <img src="img/Logo.jpg" alt="Logo de Emperor Store" class="logo-navbar">
            </a>
            <ul id="nav-mobile" class="right hide-on-med-and-down">
                <li><a href="index.html">Home</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li>
                    <a href="carrito.html">
                        <i class="material-icons">shopping_cart</i>
                    </a>
                </li>
            </ul>
        </div>
    </nav>
</header>
    <main class = "container">
        <h1>Carrito de compras</h1>
        <div class="row">
            <div class="col s12" id="producto-bolter">
                <div class="card horizontal">
                    <div class="card-image">
                        <img src="img/Bolter.webp" alt="Bolter">
                    </div>
                    <div class="card-stacked">  
                        <div class="card-content">
                            <h5>Bolter</h5>
                            <p>Precio: $2</p>
                            <p>Cantidad: 1</p>
                        </div>
                        <div class="card-action">
                            <button class="btn red" id="eliminar-bolter">
                                <i class="material-icons left">delete</i>
                                Eliminar
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <section class="section">
            <div class="card">
                <div class="card-content">
                    <h4>Resumen de compra</h4>
                    <p>
                        Subtotal:
                        $<span id="subtotal">2</span>
                    </p>
                    <p>
                        Total:
                        $<span id="total">2</span>
                    </p>
                </div>
                <div class="card-action">
                    <button class="btn red" id="vaciar-carrito">
                        Vaciar carrito
                    </button>
                </div>
            </div>
        </section>
        <p>Tu carrito está vacío.</p>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script src="js/carrito.js"></script>
</body>
</html>
